<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>가상 주식 거래 | AI Stock Simulator</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-content">
      <strong class="brand"><span class="brand-mark" aria-hidden="true"></span>AI Stock Simulator</strong>
      <div class="topbar-meta">
        <span id="turn"></span>
        <span class="sample-label">예제 데이터</span>
      </div>
    </div>
  </header>
  <main class="wrap layout">
    <div class="detail">
      <section class="panel quote" aria-labelledby="quote-name">
        <h1 id="quote-name"></h1>
        <p class="quote-price">
          <strong id="price"></strong>
          <span id="change"></span>
          <span class="change-label">이전 턴 대비</span>
        </p>
        <dl class="stats" aria-label="이번 턴 시세">
          <div><dt>시가</dt><dd id="stat-open"></dd></div>
          <div><dt>고가</dt><dd id="stat-high"></dd></div>
          <div><dt>저가</dt><dd id="stat-low"></dd></div>
          <div><dt>이전 종가</dt><dd id="stat-prev"></dd></div>
          <div><dt>거래량(주)</dt><dd id="stat-volume"></dd></div>
        </dl>
      </section>
      <section class="panel chart-panel" aria-labelledby="chart-title">
        <div class="panel-head">
          <h2 id="chart-title">차트</h2>
          <div class="ranges" role="group" aria-label="차트 기간">
            <button type="button" data-size="3">3턴</button>
            <button type="button" data-size="5">5턴</button>
            <button type="button" data-size="0">전체</button>
          </div>
        </div>
        <p id="chart-legend" class="legend"></p>
        <canvas id="price-chart" role="img"></canvas>
      </section>
      <div class="lower">
        <section class="panel book" aria-labelledby="book-title">
          <div class="panel-head">
            <h2 id="book-title">호가</h2>
            <span class="note">가격을 누르면 지정가로 입력</span>
          </div>
          <table class="book-table">
            <thead>
              <tr><th scope="col">매도 잔량</th><th scope="col">가격</th><th scope="col">매수 잔량</th></tr>
            </thead>
            <tbody id="book"></tbody>
            <tfoot>
              <tr><td id="ask-total"></td><th scope="row">잔량 합계</th><td id="bid-total"></td></tr>
            </tfoot>
          </table>
        </section>
        <section class="panel assets" aria-labelledby="assets-title">
          <h2 id="assets-title">내 주식</h2>
          <dl class="asset-list">
            <div class="lead"><dt>평가 금액</dt><dd id="market-value"></dd></div>
            <div><dt>평가 손익</dt><dd id="profit"></dd></div>
            <div><dt>보유 수량</dt><dd id="holding"></dd></div>
            <div><dt>평균 단가</dt><dd id="average-price"></dd></div>
          </dl>
        </section>
        <section class="panel account" aria-labelledby="account-title">
          <h2 id="account-title">내 계좌</h2>
          <dl class="asset-list">
            <div class="lead"><dt>총자산</dt><dd id="equity"></dd></div>
            <div><dt>주문 가능 현금</dt><dd id="cash"></dd></div>
            <div><dt>총 손익</dt><dd id="return"></dd></div>
          </dl>
        </section>
      </div>
    </div>
    <div class="side">
      <section class="panel order" aria-labelledby="order-title">
        <h2 id="order-title" class="visually-hidden">주문 미리보기</h2>
        <form id="order-form" data-side="buy" novalidate>
          <fieldset class="sides" aria-label="매수 또는 매도">
            <label><input type="radio" name="side" value="buy" checked><span>매수</span></label>
            <label><input type="radio" name="side" value="sell"><span>매도</span></label>
          </fieldset>
          <p class="order-stock"><strong id="order-stock"></strong><span id="order-current"></span></p>
          <fieldset class="types" aria-label="주문 유형">
            <label><input type="radio" name="type" value="limit" checked><span>지정가</span></label>
            <label><input type="radio" name="type" value="market"><span>시장가</span></label>
          </fieldset>
          <label class="field-label" for="order-price">가격</label>
          <div class="stepper">
            <button type="button" data-step="price" data-dir="-1" aria-label="한 호가 내리기">−</button>
            <input id="order-price" name="price" type="number" inputmode="numeric" min="1" required aria-describedby="tick-note">
            <span class="unit">원</span>
            <button type="button" data-step="price" data-dir="1" aria-label="한 호가 올리기">+</button>
          </div>
          <p id="tick-note" class="field-note"></p>
          <label class="field-label" for="quantity">수량</label>
          <div class="stepper">
            <button type="button" data-step="quantity" data-dir="-1" aria-label="1주 줄이기">−</button>
            <input id="quantity" name="quantity" type="number" inputmode="numeric" min="1" step="1" value="1" required aria-describedby="available">
            <span class="unit">주</span>
            <button type="button" data-step="quantity" data-dir="1" aria-label="1주 늘리기">+</button>
          </div>
          <div class="ratios" role="group" aria-label="가능 수량 대비 비율">
            <button type="button" data-ratio="0.1">10%</button>
            <button type="button" data-ratio="0.25">25%</button>
            <button type="button" data-ratio="0.5">50%</button>
            <button type="button" data-ratio="1">최대</button>
          </div>
          <dl class="order-summary">
            <div><dt id="available-label"></dt><dd id="available"></dd></div>
            <div class="total"><dt>총 주문 금액</dt><dd><output id="estimate" for="order-price quantity"></output></dd></div>
          </dl>
          <button id="preview-order" class="order-button" type="submit"></button>
          <p id="order-status" class="order-status" role="status"></p>
        </form>
      </section>
      <section class="panel watchlist" aria-labelledby="market-title">
        <div class="panel-head">
          <h2 id="market-title">관심 종목</h2>
          <span class="note">이전 턴 대비</span>
        </div>
        <div id="stocks" class="stock-list"></div>
      </section>
    </div>
  </main>
</body>
</html>
